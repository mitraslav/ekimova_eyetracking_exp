{% load static %}
<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Проба {{ trial_number }}</title>
<link rel="stylesheet" href="{% static 'experiment/style.css' %}"></head><body class="locked">

<div id="fixation-overlay" class="fixation-overlay"><div class="fixation-cross">+</div></div>

<div id="trial" class="page">
  <div class="form-card">
    <div class="meta">Проба {{ trial_number }} из {{ total_trials }}</div>
    <h1>Регистрация</h1>
    <p class="subtitle">Проверьте данные и нажмите «Продолжить».</p>

    <div class="global-error-slot">
      <div id="global-error" class="error-popover global-popover is-hidden">
        {{ error_message }}
      </div>
    </div>

    <form onsubmit="return false;">
      {% for field in fields %}
        <div class="field-block" data-field="{{ field.name }}">
          <label for="{{ field.name }}">{{ field.label }}</label>
          <input id="{{ field.name }}" name="{{ field.name }}"
                 type="{% if field.name == 'password' %}password{% else %}text{% endif %}"
                 value="{{ field.value }}">
          {% if field.is_target and condition == 'local' %}
            <div class="error-popover local-popover is-hidden">{{ error_message }}</div>
          {% endif %}
        </div>
      {% endfor %}
      <button id="continue" type="button">Продолжить</button>
    </form>
  </div>
</div>
<script>
window.EXPERIMENT={
  trialNumber:{{ trial_number }},totalTrials:{{ total_trials }},targetField:"{{ target_field }}",
  condition:"{{ condition }}",saveUrl:"{% url 'experiment:save_result' %}",
  nextUrl:"{% if trial_number < total_trials %}{% url 'experiment:trial' trial_number=trial_number|add:'1' %}{% else %}{% url 'experiment:finish' %}{% endif %}"
};
</script>
<script src="{% static 'experiment/trial.js' %}"></script>
</body></html>
