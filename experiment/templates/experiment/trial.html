{% load static %}

<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8">

  <title>Эксперимент</title>

  <link
    rel="stylesheet"
    href="{% static 'experiment/style.css' %}"
  >
</head>

<body class="locked">

<!-- Нужен для CSRF-cookie -->
<div style="display:none;">
  {% csrf_token %}
</div>


<!-- Фиксационный крест -->
<div
  id="fixation-overlay"
  class="fixation-overlay is-hidden"
>
  <div class="fixation-cross">
    +
  </div>
</div>


<!-- Основная страница trial -->
<div
  id="trial"
  class="page"
  style="visibility:hidden;"
>

  <div class="form-card">

    <div
      id="trial-meta"
      class="meta"
    ></div>

    <h1>
      Регистрация
    </h1>

    <p class="subtitle">
      Проверьте данные и нажмите «Продолжить».
    </p>


    <div class="global-error-slot">

      <div
        id="global-error"
        class="error-popover global-popover is-hidden"
      ></div>

    </div>


    <form onsubmit="return false;">

      <div id="fields-container"></div>

      <button
        id="continue"
        type="button"
      >
        Продолжить
      </button>

    </form>

  </div>

</div>


<!-- Финальный экран.
     Он находится на той же странице,
     поэтому tracker не уничтожается. -->
<div
  id="finish-screen"
  class="page"
  style="display:none;"
>

  <div class="card">

    <h1>
      Спасибо!
    </h1>

    <p>
      Эксперимент завершён.
    </p>

  </div>

</div>


<!-- Первая проба из Django -->
{{ initial_trial|json_script:"initial-trial-data" }}


<script>
window.EXPERIMENT = {
  participantId:
    "{{ participant_id|escapejs }}",

  saveUrl:
    "{% url 'experiment:save_result' %}",

  chiasmToken:
    "{{ chiasm_token|escapejs }}",

  chiasmExperimentId:
    "{{ chiasm_experiment_id|escapejs }}"
};
</script>


<!-- Chiasm -->
<script src="https://cdn.chiasm.eu/latest/chiasm-tracker.js"></script>


<!-- Наш эксперимент -->
<script
  src="{% static 'experiment/trial.js' %}">
</script>

</body>
</html>
